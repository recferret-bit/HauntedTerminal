<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="/src/styles/fonts.css"><style>html,body{margin:0;background:#f0e8d6;color:#1a1a1a;font:600 18px "Chakra Petch";overflow:hidden}.mono{font-family:"IBM Plex Mono"}</style><title>animated</title><style>@keyframes spin{to{transform:rotate(360deg)}}.s{width:80px;height:80px;background:#e8403a;animation:spin 1s linear infinite;margin:40px}</style>
<div class="s"></div><canvas id="c" width="600" height="300"></canvas>
<script>const g = c.getContext('2d'); const loop = () => { const t = performance.now(); g.fillStyle = '#f0e8d6'; g.fillRect(0, 0, 600, 300); g.fillStyle = '#1a1a1a'; g.fillRect((t / 4) % 560, 100, 40, 40); requestAnimationFrame(loop); }; requestAnimationFrame(loop);</script>
