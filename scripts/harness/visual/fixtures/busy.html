<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="/src/styles/fonts.css"><style>html,body{margin:0;background:#f0e8d6;color:#1a1a1a;font:600 18px "Chakra Petch";overflow:hidden}.mono{font-family:"IBM Plex Mono"}</style><title>busy</title><p style="margin:40px">a heavy frame loop</p>
<script>let x = 0; const loop = () => { for (let i = 0; i < 4e6; i++) x += Math.sqrt(i); requestAnimationFrame(loop); }; requestAnimationFrame(loop);</script>
