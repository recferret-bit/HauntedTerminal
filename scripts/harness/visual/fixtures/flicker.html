<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="/src/styles/fonts.css"><style>html,body{margin:0;background:#f0e8d6;color:#1a1a1a;font:600 18px "Chakra Petch";overflow:hidden}.mono{font-family:"IBM Plex Mono"}</style><title>flicker</title><style>.flash{position:fixed;inset:0;background:#fff;display:none}</style>
<p style="margin:40px;font-size:40px">STEADY PANEL</p><div class="flash" id="f"></div>
<script>window.__flick = () => { let n = 0; const id = setInterval(() => { f.style.display = n % 4 === 1 ? 'block' : 'none'; if (++n > 40) clearInterval(id); }, 130); };</script>
