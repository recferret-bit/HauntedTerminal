<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haunted Terminal - cinematics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <style>
      html, body { margin: 0; height: 100%; background: #07080a; color: #f4f1ea; font: 14px "IBM Plex Mono", monospace; overflow: hidden; }
      #host { position: absolute; inset: 0; }
      #menu { position: absolute; inset: 0; display: grid; place-items: center; }
      #menu[hidden] { display: none; }
      #menu div { display: grid; gap: 10px; text-align: center; }
      #menu button { font: 700 18px "Chakra Petch", sans-serif; padding: 10px 22px; background: #ffd166; border: 3px solid #f4f1ea; cursor: pointer; }
      #menu p { opacity: 0.7; max-width: 520px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <div id="menu" hidden>
      <div>
        <button data-play="intro" type="button">PLAY INTRO</button>
        <button data-play="outro" type="button">PLAY OUTRO</button>
        <p>?play=intro|outro &amp; t=&lt;seconds&gt; (freeze) &amp; muted=1 &amp; rank=S|A|B|C &amp; skippable=0</p>
      </div>
    </div>
    <script type="module" src="/src/cinematic/preview.ts"></script>
  </body>
</html>
