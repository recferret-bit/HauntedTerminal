<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080a" />
    <title>Out Of Credits — Play</title>
    <link rel="preload" href="/fonts/chakra-petch-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23140f12'/%3E%3Crect x='2' y='3' width='12' height='9' fill='%23ffd166'/%3E%3Crect x='4' y='6' width='2' height='2' fill='%23140f12'/%3E%3Crect x='7' y='9' width='5' height='1' fill='%23ff6a13'/%3E%3C/svg%3E" />
    <style>
      html, body { height: 100%; margin: 0; background: #07080a; overflow: hidden; }
      body.hud-hidden #topbar, body.hud-hidden #sandbox-toggle-btn,
      body.term-off #terminal-bezel, body.cine #page, .hidden { visibility: hidden; }
      #stage-caption { display: none; }
    </style>
    <link rel="stylesheet" href="/src/styles/game.css" />
    <link rel="stylesheet" href="/src/styles/dialog.css" />
    <link rel="stylesheet" href="/src/styles/esc-menu.css" />
    <link rel="stylesheet" href="/src/styles/hint-dialog.css" />
    <link rel="stylesheet" href="/src/styles/chapter-map.css" />
    <link rel="stylesheet" href="/src/styles/terminal-skins.css" />
  </head>
  <body class="term-off hud-hidden">
    <div id="page">
      <div id="stage-wrapper">
        <div id="stage-mount"></div>
        <div id="topbar">
          <div id="titleblock">
            <div id="stage-caption">FLOOR 01 // /home/dev/nightmare_workspace/desk</div>
          </div>
          <div id="hud"></div>
        </div>
        <button id="sandbox-toggle-btn" type="button" title="Shortcut: F2">F2</button>
        <aside id="dev-inspector" class="hidden"></aside>
        <div id="outro"></div>
      </div>
      <div id="terminal-dock">
        <section id="code-editor-pane" class="hidden" aria-label="Split Code Mini-Editor"></section>
        <div id="terminal-bezel" data-skin="iterm2">
          <div id="tty-bar">
            <span class="tty-dots" aria-hidden="true"><i class="tty-dot tty-close"></i><i class="tty-dot tty-min"></i><i class="tty-dot tty-zoom"></i></span>
            <span class="tty-title">vibecoder@motherboard: ~ (zsh)</span>
            <span class="tty-bar-right"><button type="button" id="tty-manual-btn" title="Open Interactive Terminal Field Manual (F1)">MANUAL (F1)</button><span class="tty-winbtns" aria-hidden="true"><i class="tty-wb tty-wb-min"></i><i class="tty-wb tty-wb-max"></i><i class="tty-wb tty-wb-close"></i></span></span>
          </div>
          <div id="tty-tabs" role="tablist" aria-label="Terminal tabs"><span class="tty-tab active" role="tab" aria-selected="true"><span class="tty-tab-label">zsh</span></span><span class="tty-tab-new" aria-hidden="true"><i class="tty-plus"></i><i class="tty-chev"></i></span></div>
          <div id="terminal-panel"></div>
        </div>
      </div>
    </div>
    <div id="manual-book-modal" class="mb-modal hidden" role="dialog" aria-modal="true" aria-label="Interactive Terminal Field Manual"></div>
    <div id="cinematic"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
