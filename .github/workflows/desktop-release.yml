name: Desktop Release Builds (Tauri + Steamworks)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      steam_enabled:
        description: 'Compile with Steamworks SDK Cargo feature (`--features steam`)'
        required: false
        type: boolean
        default: false
      steam_app_id:
        description: 'Optional Steam App ID (leave empty for standalone build until Steamworks Partner App ID is issued)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  verify-and-web-bundle:
    name: Quality Gates & Offline Web Bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run quality & headless 0-death chapter gates
        run: |
          npm run quality
          node scripts/harness/generate-chapter.mjs --verify
          node scripts/desktop/desktop-unit.mjs

      - name: Package portable offline web archive
        shell: bash
        run: |
          EXTRA_ARGS=(--portable-only)
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            EXTRA_ARGS+=(--version "${GITHUB_REF_NAME#v}")
          fi
          node scripts/desktop/build-tauri-steam.mjs "${EXTRA_ARGS[@]}"

      - name: Upload offline web archive
        uses: actions/upload-artifact@v4
        with:
          name: desktop-offline-web
          path: dist-desktop/*.tar.gz
          if-no-files-found: error

  build-tauri-desktop:
    name: Native Tauri Build (${{ matrix.label }})
    needs: verify-and-web-bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-universal
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_target: universal-apple-darwin
          - label: linux-x86_64
            os: ubuntu-22.04
            rust_targets: ''
            tauri_target: ''
          - label: windows-x64
            os: windows-latest
            rust_targets: ''
            tauri_target: ''

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux WebKitGTK & AppImage dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            xdg-utils

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm packages
        run: npm ci

      - name: Pre-generate src-tauri Cargo workspace for Rust cache
        shell: bash
        run: |
          GEN_ARGS=()
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            GEN_ARGS+=(--version "${GITHUB_REF_NAME#v}")
          fi
          node scripts/desktop/generate-tauri-steam.mjs "${GEN_ARGS[@]}"

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Run Rust DesktopBridge, Auto-Cloud & Steamworks SDK tests
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --features steam

      - name: Build native Tauri desktop installers
        shell: bash
        env:
          INPUT_STEAM_APP_ID: ${{ inputs.steam_app_id || vars.STEAM_APP_ID || '' }}
          WANT_STEAM: ${{ (github.event_name == 'workflow_dispatch' && inputs.steam_enabled && 'true') || (github.event_name != 'workflow_dispatch' && vars.STEAM_ENABLED == 'true' && 'true') || 'false' }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          EXTRA_ARGS=()
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            EXTRA_ARGS+=(--version "${GITHUB_REF_NAME#v}")
          fi
          if [ -n "${{ matrix.tauri_target }}" ]; then
            EXTRA_ARGS+=(--target "${{ matrix.tauri_target }}")
          fi
          if [ "$WANT_STEAM" = "true" ]; then
            EXTRA_ARGS+=(--steam)
            if [ -n "$INPUT_STEAM_APP_ID" ]; then
              EXTRA_ARGS+=(--app-id "$INPUT_STEAM_APP_ID")
            fi
          else
            EXTRA_ARGS+=(--no-steam)
          fi
          node scripts/desktop/build-tauri-steam.mjs "${EXTRA_ARGS[@]}"
          rm -f dist-desktop/*-offline-web.tar.gz dist-desktop/SHA256SUMS.txt

      - name: Upload ${{ matrix.label }} installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: dist-desktop/*
          if-no-files-found: error

  publish-github-release:
    name: Attach Downloadable Builds to GitHub Tag Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify-and-web-bundle
      - build-tauri-desktop
    runs-on: ubuntu-22.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-Input
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        run: |
          cd release-Input
          rm -f SHA256SUMS.txt
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release for ${{ github.ref_name }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Haunted Terminal ${{ github.ref_name }} — Desktop & Offline Demo Builds
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Haunted Terminal ${{ github.ref_name }} — Dedicated Downloadable Builds

            - **macOS (Universal Intel + Apple Silicon):** `Haunted-Terminal_*_universal.dmg`
            - **Windows 10/11 (x64):** `Haunted-Terminal_*_x64-setup.exe` / `.msi`
            - **Linux / Steam Deck (x86_64):** `Haunted-Terminal_*_amd64.AppImage` / `.deb`
            - **Portable Offline Web Bundle:** `haunted-terminal-*-offline-web.tar.gz`
            - **Integrity:** Verify downloads against `SHA256SUMS.txt`.

            Browser saves, Silicon Scrap perks, and all 12 `ACH_*` Steamworks-ready local achievements import directly via the **Import Save Bundle (.json)** button on `/` or `/chapters.html` and persist in `<app_data_dir>/haunted-terminal-save.json` for cross-OS Steam Auto-Cloud sync.
          files: release-Input/*
